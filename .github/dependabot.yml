---
version: 2

updates:
  # ============================================
  # Node.js/npm Dependencies
  # ============================================
  - package-ecosystem: "npm"
    directory: "/src/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "Europe/Madrid"

    # Rebase automático cuando cambia la rama base
    rebase-strategy: "auto"

    # Límite de PRs abiertos simultáneamente
    open-pull-requests-limit: 10

    # Formato de nombres de rama
    pull-request-branch-name:
      separator: "-"

    # Mensajes de commit
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: "scope"

    # Labels automáticos
    labels:
      - "dependencies"
      - "automerge"

    # Agrupar dependencias para reducir PRs
    groups:
      # Grupo 1: Dependencias de desarrollo (minor/patch)
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # Grupo 2: Dependencias de producción (solo patches)
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"

      # Grupo 3: Next.js ecosystem
      nextjs-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
        update-types:
          - "minor"
          - "patch"

    # Ignorar actualizaciones mayores de ciertos paquetes
    ignore:
      # Webpack major updates requieren revisión manual
      - dependency-name: "webpack"
        update-types: ["version-update:semver-major"]

      # TypeScript major updates requieren revisión manual
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ============================================
  # GitHub Actions Dependencies
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:22"

    labels:
      - "github-actions"
      - "automerge"

    commit-message:
      prefix: "ci"
      include: "scope"

    # Agrupar todas las actualizaciones de actions
    groups:
      github-actions:
        patterns:
          - "*"

