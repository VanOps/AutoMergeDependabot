---
name: 🔄 Auto-Rebase Dependabot PRs

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase-dependabot-prs:
    name: 🔄 Rebase Dependabot PRs
    runs-on: ubuntu-latest

    steps:
      - name: � Checkout repository
        uses: actions/checkout@v4

      - name: �📋 List open Dependabot PRs
        id: list-prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener PRs abiertas de Dependabot (en una sola línea)
          prs=$(gh pr list \
            --repo ${{ github.repository }} \
            --author "app/dependabot" \
            --state open \
            --json number \
            --jq '[.[].number] | join(" ")')

          echo "Found PRs: $prs"
          echo "pr_numbers=$prs" >> $GITHUB_OUTPUT

      - name: 🔄 Rebase Dependabot PRs
        if: steps.list-prs.outputs.pr_numbers != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rebasar cada PR de Dependabot usando GitHub API
          for pr_number in ${{ steps.list-prs.outputs.pr_numbers }}; do
            echo "🔄 Updating PR #$pr_number with base branch"
            
            # Actualizar la PR con la rama base usando GitHub API
            http_code=$(gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/pulls/${pr_number}/update-branch" \
              --silent \
              --include 2>&1 | head -n 1 | cut -d' ' -f2)
            
            case "$http_code" in
              200|202)
                echo "✅ PR #$pr_number update initiated successfully"
                echo "ℹ️ GitHub will automatically trigger CI workflows once the update completes"
                ;;
              422)
                echo "ℹ️ PR #$pr_number is already up to date with base branch"
                ;;
              *)
                echo "⚠️ Unexpected response code $http_code for PR #$pr_number"
                ;;
            esac
            
            # Esperar un poco para no saturar la API y permitir que GitHub procese
            sleep 3
          done

      - name: 📊 Summary
        if: steps.list-prs.outputs.pr_numbers != ''
        run: |
          pr_list="${{ steps.list-prs.outputs.pr_numbers }}"
          pr_count=$(echo "$pr_list" | wc -w)
          echo "### 🔄 Dependabot PRs Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Updated **$pr_count** Dependabot PR(s) with base branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PRs updated: $pr_list" >> $GITHUB_STEP_SUMMARY

      - name: 📊 No PRs Summary
        if: steps.list-prs.outputs.pr_numbers == ''
        run: |
          echo "### ℹ️ No Dependabot PRs to Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No open Dependabot PRs found." >> $GITHUB_STEP_SUMMARY
